name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run enforcement tests
        run: python -m pytest tests/enforcement_integration/ -v

      - name: Validate scenario test YAML
        run: |
          python -c "
          import yaml
          from pathlib import Path
          errors = []
          for f in Path('tests/skills/scenarios').rglob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('YAML validation errors:')
              for e in errors:
                  print(f'  {e}')
              exit(1)
          print(f'All scenario YAML files valid ({len(list(Path(\"tests/skills/scenarios\").rglob(\"*.yaml\")))} files)')
          "
