name: Contract Adapter Impact

on:
  pull_request:
    paths:
      - "docs/archived-workflows/*.md"
      - "scripts/report_contract_adapter_impact.py"
      - ".github/workflows/contract-adapter-impact.yml"
  workflow_dispatch:

permissions: {}

jobs:
  report-impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Detect impacted adapters from canonical contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/report_contract_adapter_impact.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Validate canonical contract schema and registry
        run: python3 scripts/validate_canonical_contracts.py
